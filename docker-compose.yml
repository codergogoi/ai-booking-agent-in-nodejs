name: willow-salon

services:
  mongo:
    image: mongo:8
    ports:
      - "27022:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: .
    command: ["node", "dist/seed.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/willow_salon
    depends_on:
      mongo:
        condition: service_healthy

  agent:
    build: .
    init: true
    ports:
      - "3500:3500"
    environment:
      PORT: 3500
      MONGODB_URI: mongodb://mongo:27017/willow_salon
      LLM_MODE: ${LLM_MODE:-live}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3500/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
